name: ESLint and Prettier frontend checks

on:
  push:
    paths:
      - "frontend/**/*"
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  linter-formatter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ESLint and Prettier frontend checks
        uses: actions/setup-node@v6
        with:
          node-version: 24
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run check
